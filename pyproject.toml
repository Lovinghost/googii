[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "code-agent-mvp"
version = "0.1.0"
description = "A minimal Code Agent built with FastAPI, LangGraph, MCP, and Docker."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "aiosqlite>=0.20,<1",
  "fastapi==0.139.0",
  "langchain-anthropic==1.4.8",
  "langchain-core==1.4.9",
  "langchain-openai==1.3.5",
  "langgraph==1.2.9",
  "langgraph-checkpoint-sqlite==3.1.0",
  "mcp==1.28.1",
  "pydantic-settings==2.14.2",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1",
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.25,<1",
  "ruff>=0.11,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["api", "agent", "mcp_client", "sandbox", "servers"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
ignore = ["ASYNC109"]
